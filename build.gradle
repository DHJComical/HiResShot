plugins {
    id 'java'
    id 'dev.architectury.loom' version '1.4-SNAPSHOT'
}

version = mod_version
group = mod_group_id
archivesBaseName = 'HiResShot-Forge-1.18.2'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    forge {
        mixinConfig "hiresshot.mixins.json"
    }

    runs {
        client {
            client()
            ideConfigGenerated = true
            runDir "run"
        }
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://cursemaven.com" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.18.2"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:1.18.2-40.3.12"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:6.5.102"
    modImplementation "curse.maven:oculus-581495:4578744"
    modImplementation "curse.maven:embeddium-908741:5322305"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand(
                "version": project.version,
                "loader_version_range": "[40,)",
                "forge_version_range": "[40,)",
                "minecraft_version_range": "[1.18.2,1.19)",
                "mod_version": mod_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_license": mod_license,
                "mod_authors": mod_authors,
                "mod_description": mod_description
        )
    }
}